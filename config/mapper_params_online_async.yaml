slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss  # Changed: Robust to outliers in large maps
    
    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping
    
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0  # Changed: 5.0→2.0 for more frequent updates in large areas
    resolution: 0.05
    min_laser_range: 0.0
    max_laser_range: 20.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    
    # General Parameters - CRITICAL FOR LARGE MAPS
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3  # Changed: 0.5→0.3 for denser keyframes in large areas
    minimum_travel_heading: 0.3   # Changed: 0.5→0.3 (radians ≈ 17°) for better coverage
    scan_buffer_size: 150         # Changed: 100→150 to handle more scans
    scan_buffer_maximum_scan_distance: 150.0  # Changed: 100→150 for large map
    link_match_minimum_response_fine: 0.2   # Changed: 0.1→0.2 stricter for reliability
    link_scan_maximum_distance: 2.5         # Changed: 1.5→2.5 allow larger jumps
    
    # Loop Closure - MOST IMPORTANT FOR LARGE MAPS
    loop_search_maximum_distance: 20.0      # Changed: 100→20 CRITICAL! Reduce search radius
    do_loop_closing: true
    loop_match_minimum_chain_size: 15       # Changed: 10→15 require more evidence
    loop_match_maximum_variance_coarse: 2.0 # Changed: 3.0→2.0 stricter variance
    loop_match_minimum_response_coarse: 0.45  # Changed: 0.35→0.45 stricter threshold
    loop_match_minimum_response_fine: 0.55    # Changed: 0.45→0.55 stricter fine match
    
    # Correlation Parameters - Regular Scan Matching
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    
    # Correlation Parameters - Loop Closure Search
    loop_search_space_dimension: 6.0        # Changed: 8.0→6.0 reduce computational load
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    
    # Scan Matcher Parameters
    distance_variance_penalty: 0.3          # Changed: 0.5→0.3 more lenient for odometry drift
    angle_variance_penalty: 0.8             # Changed: 1.0→0.8 more lenient for rotation drift
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
    
    # Additional parameters for large maps
    max_laser_range: 12.0                   # Changed: 20.0→12.0 reduce noise from far objects
    minimum_time_interval: 0.3              # Changed: 0.5→0.3 process scans more frequently
